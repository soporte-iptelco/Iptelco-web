<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Ayuda & Soporte | IPTELCO S.A.S</title>

  <!-- FAVICON PESTAÑA NAVEGADOR -->
  <link rel="icon" type="image/png" href="img/icono-iptelco.png">
  <link rel="shortcut icon" type="image/png" href="img/icono-iptelco.png">

  <!-- FUENTES DE GOOGLE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- HOJA DE ESTILOS PRINCIPAL GLOBAL -->
  <link rel="stylesheet" href="styles.css">

  <!-- ESTILOS EXCLUSIVOS DEL FORMULARIO Y POPUP MODAL -->
  <style>
    .form-container-wrapper { max-width: 850px; margin: 50px auto 80px auto; padding: 0 20px; }
    .form-card { background: #ffffff; border: 1px solid var(--border-light); border-top: 5px solid var(--accent-blue); border-radius: 24px; padding: 45px 50px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08); }
    .form-header { text-align: center; margin-bottom: 35px; display: flex; flex-direction: column; align-items: center; }
    .form-card-logo { height: 115px !important; max-height: 115px !important; width: auto !important; object-fit: contain !important; margin-bottom: 18px; }
    .form-header h1 { font-size: 2.3rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; line-height: 1.2; }
    .form-header h1 span { color: var(--accent-blue); }
    .form-header p { color: #334155; font-size: 0.98rem; font-weight: 500; max-width: 600px; }
    .support-form { display: flex; flex-direction: column; gap: 22px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { font-size: 0.92rem; font-weight: 700; color: #0f172a; }
    label span.required { color: #dc2626; }
    .sub-label { font-size: 0.8rem; color: #475569; font-weight: 500; }
    input[type="text"], input[type="tel"], input[type="email"], textarea { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px 18px; color: #0f172a; font-family: inherit; font-size: 0.95rem; font-weight: 600; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus, textarea:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
    textarea { resize: vertical; min-height: 120px; }
    input[type="file"] { padding: 10px; cursor: pointer; color: #334155; }
    input[type="file"]::file-selector-button { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 15px; }
    .btn-submit { background: linear-gradient(135deg, var(--accent-blue), #1d4ed8); color: #ffffff; font-size: 1.05rem; font-weight: 800; padding: 16px; border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-submit:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); transform: translateY(-2px); box-shadow: 0 6px 25px rgba(37, 99, 235, 0.35); }

    /* POPUP MODAL ESTILOS */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #ffffff; border-radius: 16px; width: 100%; max-width: 420px; padding: 32px 24px; position: relative; box-shadow: 0 20px 30px rgba(15, 23, 42, 0.15); text-align: center; border: 1px solid #cbd5e1; }
    .modal-close-btn { position: absolute; top: 16px; right: 16px; background: transparent; border: none; font-size: 20px; color: #64748b; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .modal-close-btn:hover { background-color: #f1f5f9; color: #0f172a; }
    .modal-icon-container { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; }
    .modal-icon { width: 28px; height: 28px; }
    .theme-success .modal-icon-container { background-color: #dcfce7; color: #16a34a; }
    .theme-error .modal-icon-container { background-color: #fee2e2; color: #dc2626; }
    .modal-title { font-size: 1.15rem; font-weight: 800; color: #0f172a; margin: 0 0 8px 0; }
    .modal-text { font-size: 0.92rem; color: #334155; margin: 0; line-height: 1.6; font-weight: 500; }
    .modal-btn-action { margin-top: 24px; background-color: #0f172a; color: white; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s ease; }
    .modal-btn-action:hover { background-color: #1e293b; }
    @media (max-width: 900px) { .form-grid-2 { grid-template-columns: 1fr; } .form-card { padding: 25px 20px; } }
  </style>
</head>
<body>

  <!-- PRELOADER -->
  <div id="iptelco-preloader">
    <div class="preloader-content">
      <img src="img/logo-main.png" alt="IPTELCO Logo" class="preloader-logo-img">
    </div>
  </div>
  <div class="glow-bg"></div>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="brand-logo-container">
      <img src="img/logo-main.png" alt="IPTELCO Logo" class="brand-logo-img">
    </a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="telefonia-ip.html">Telefonía IP</a>
      <a href="ciberseguridad.html">Ciberseguridad</a>
      <a href="redes-mikrotik.html">Redes</a>
      <a href="cctv-biometria.html">CCTV & Biometría</a>
      <a href="soluciones-cloud.html">Cloud & 365</a>
      <a href="outsourcing-ti.html">Soporte TI</a>
    </nav>
    <div class="header-actions">
      <a href="soporte.html" class="btn-soporte">🛠️ Soporte IPTELCO</a>
      <a href="cotizacion.html" class="btn-cotizar">Solicitar Cotización</a>
    </div>
  </header>

  <!-- FORMULARIO DE SOPORTE VTIGER -->
  <div class="form-container-wrapper">
    <div class="form-card">
      
      <div class="form-header">
        <img src="img/logo-main.png" alt="IPTELCO Logo" class="form-card-logo">
        <h1>Solicitud de Soporte <span>IPTELCO</span></h1>
        <p>Complete los datos para radicar su ticket directamente en nuestra Mesa de Ayuda</p>
      </div>

      <div id="form-status"></div>

      <form id="vtiger-support-form" class="support-form">
        
        <div class="form-group">
          <label>Título del Caso <span class="required">*</span></label>
          <input type="text" id="titulo_caso" placeholder="Ej. Falla en sistema de telefonía o red" required>
        </div>

        <div class="form-group">
          <label>Descripción <span class="required">*</span></label>
          <textarea id="descripcion_caso" placeholder="Detalle su requerimiento o problema técnico..." required></textarea>
        </div>

        <!-- ADJUNTAR EVIDENCIA -->
        <div class="form-group">
          <label>Adjuntar Evidencia <span class="sub-label">(Opcional. Máx 2.5MB. Imágenes o Videos cortos)</span></label>
          <input type="file" id="evidencia_caso" accept="image/*, video/mp4, video/webm, video/quicktime">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>NIT de la Empresa <span class="required">*</span></label>
            <span class="sub-label">Sin puntos, guiones ni dígito de verificación</span>
            <input type="text" id="nit_empresa" placeholder="Ej. 900123456" required>
          </div>

          <div class="form-group">
            <label>Nombre de Contacto <span class="required">*</span></label>
            <input type="text" id="nombre_contacto" placeholder="Ej. Juan Pérez" required>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Celular de Contacto <span class="required">*</span></label>
            <input type="tel" id="celular_contacto" placeholder="Ej. 3001234567" required>
          </div>

          <div class="form-group">
            <label>Correo Electrónico <span class="required">*</span></label>
            <input type="email" id="correo_contacto" placeholder="correo@empresa.com" required>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-enviar">Crear Solicitud</button>

      </form>

    </div>
  </div>

  <!-- ESTRUCTURA DEL POPUP (MODAL) -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close-btn" id="btnCloseIcon">✕</button>
      <div id="modalBody">
        <!-- Contenido inyectado por JS -->
      </div>
      <button class="modal-btn-action" id="btnCerrarModal">Entendido</button>
    </div>
  </div>

  <!-- FOOTER Y BOTÓN WHATSAPP CENTRALIZADOS -->
  <iptelco-footer></iptelco-footer>
  <script src="footer.js"></script>

  <!-- SCRIPT DE ENVÍO VTIGER CRM -->
  <script>
    const svgSuccess = `<svg class="modal-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
    const svgError = `<svg class="modal-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

    const modalOverlay = document.getElementById('modalOverlay');
    const modalBody = document.getElementById('modalBody');
    const btnCloseIcon = document.getElementById('btnCloseIcon');
    const btnCerrarModal = document.getElementById('btnCerrarModal');

    function showModal(type, title, text) {
      const icon = type === 'success' ? svgSuccess : svgError;
      const themeClass = type === 'success' ? 'theme-success' : 'theme-error';
      
      modalBody.innerHTML = `
        <div class="modal-icon-container ${themeClass}">
          ${icon}
        </div>
        <h3 class="modal-title">${title}</h3>
        <p class="modal-text">${text}</p>
      `;
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    btnCloseIcon.addEventListener('click', closeModal);
    btnCerrarModal.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.getElementById('vtiger-support-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btn-enviar');

      btn.disabled = true;
      btn.innerText = 'Procesando Archivos y Creando Ticket...';

      try {
        const fileInput = document.getElementById('evidencia_caso');
        let archivoBase64 = null;
        let archivoNombre = null;
        let archivoTipo = null;

        if (fileInput && fileInput.files.length > 0) {
          const file = fileInput.files[0];
          
          if (file.size > 2621440) {
            throw new Error('El archivo adjunto supera el límite de 2.5MB. Por favor selecciona un archivo más liviano.');
          }

          archivoNombre = file.name;
          archivoTipo = file.type;

          const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
          });

          archivoBase64 = await toBase64(file);
        }

        const correoUsuario = document.getElementById('correo_contacto').value;
        const nitIngresado = document.getElementById('nit_empresa').value;

        const formData = {
          titulo: document.getElementById('titulo_caso').value,
          descripcion: document.getElementById('descripcion_caso').value,
          area: 'Soporte General',
          nit: nitIngresado,
          contacto: document.getElementById('nombre_contacto').value,
          celular: document.getElementById('celular_contacto').value,
          correo: correoUsuario,
          archivo_nombre: archivoNombre,
          archivo_tipo: archivoTipo,
          archivo_base64: archivoBase64
        };

        const API_URL = 'https://webhook-vtiger-soporte.vercel.app/api/soporte';

        let result = null;
        let response = null;

        try {
          response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });

          result = await response.json().catch(() => null);
        } catch (fetchError) {
          throw new Error('No pudimos conectar con el servidor. Por favor verifique su conexión a internet e intente nuevamente.');
        }

        if (response && response.ok && result && result.success) {
          const numCaso = result.ticket_no || result.id;
          showModal(
            'success', 
            'Solicitud registrada exitosamente', 
            `Hemos asignado el radicado <strong>${numCaso}</strong> a su caso. Se ha enviado una confirmación a <strong>${correoUsuario}</strong> y nuestro equipo le responderá a esa dirección de correo.`
          );
          document.getElementById('vtiger-support-form').reset();
          return;
        }

        showModal(
          'error', 
          'NIT no registrado', 
          `El NIT <strong>${nitIngresado}</strong> no se encuentra registrado en nuestra base de datos. Por favor verifique el número o contacte a nuestra línea de atención para validar su contrato de soporte.`
        );

      } catch (err) {
        console.error('Error enviando formulario:', err);
        showModal('error', 'Inconveniente al registrar la solicitud', err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Crear Solicitud';
      }
    });
  </script>

</body>
</html>
